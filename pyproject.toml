[project]
name = "lexbench-webfetch"
version = "0.3.0"
description = "Versioned Web Fetch tasks, acceptance contracts and frozen reference bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["beautifulsoup4==4.14.2", "soupsieve==2.9.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "apted==1.0.3", "rapidfuzz==3.14.1"]
tree = ["apted==1.0.3", "rapidfuzz==3.14.1"]

[project.scripts]
lexbench-webfetch = "lexbench_webfetch.cli:main"

[project.urls]
Repository = "https://github.com/lexmount/lexbench-webfetch"
Issues = "https://github.com/lexmount/lexbench-webfetch/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexbench_webfetch = ["definitions/*.json", "definitions/annotation-revisions/*.json", "definitions/evaluation/*.json", "definitions/evaluation/*/*.json", "definitions/evaluation/*/*.md", "definitions/evaluation/*/*/*.json", "definitions/evaluation/*/*/*/*.json"]
